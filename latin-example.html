<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latin Vocab Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff0fb; --bg2:#e9e6ff; --bg3:#e2fbff;
  --blobA:#ff7ac6; --blobB:#8b7bff; --blobC:#2ee6c9; --blobD:#ffb547;
  --card:rgba(255,255,255,.80); --cardb:rgba(255,255,255,.92); --ink:#231942; --muted:#655c8a; --line:rgba(91,63,190,.16); --soft:rgba(124,108,255,.10);
  --accent:#7c3aed; --accent2:#ec4899; --accent3:#f59e0b; --accent-ink:#fff;
  --good:#05875a; --good-bg:rgba(16,185,129,.15); --bad:#d61f45; --bad-bg:rgba(244,63,94,.12);
  --gold:#9a6209; --gold-bg:rgba(251,191,36,.20); --tip-bg:rgba(59,130,246,.12); --tip:#2257d6; --hi:rgba(250,204,21,.5);
  --l1:#d8d0fa; --l2:#ffd166; --l3:#7cc0ff; --l4:#34d399;
  --glow:0 14px 40px rgba(124,58,237,.18);
  --m1:linear-gradient(135deg,#ff6b9d,#ff9a5a); --m2:linear-gradient(135deg,#7c5cff,#3ab0ff); --m3:linear-gradient(135deg,#12c99b,#3ad0ff);
  --m4:linear-gradient(135deg,#ffb020,#ff6a3d); --m5:linear-gradient(135deg,#b44dff,#ff4d8d); --m6:linear-gradient(135deg,#ff4d6d,#8b5cf6);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0c0724; --bg2:#150b3a; --bg3:#061d33;
    --blobA:#ff3fa4; --blobB:#6d5bff; --blobC:#00d5b5; --blobD:#ff9f1c;
    --card:rgba(30,20,66,.74); --cardb:rgba(42,30,88,.92); --ink:#f4f0ff; --muted:#b2aad8; --line:rgba(255,255,255,.13); --soft:rgba(255,255,255,.07);
    --accent:#a78bfa; --accent2:#f472b6; --accent3:#fbbf24; --accent-ink:#fff;
    --good:#4ade9a; --good-bg:rgba(52,211,153,.16); --bad:#fb7185; --bad-bg:rgba(251,113,133,.15);
    --gold:#fcd34d; --gold-bg:rgba(251,191,36,.16); --tip-bg:rgba(96,165,250,.15); --tip:#9cc2ff; --hi:rgba(250,204,21,.32);
    --l1:#3e3570; --l2:#d9a422; --l3:#3b82f6; --l4:#10b981;
    --glow:0 14px 44px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg1:#0c0724; --bg2:#150b3a; --bg3:#061d33;
  --blobA:#ff3fa4; --blobB:#6d5bff; --blobC:#00d5b5; --blobD:#ff9f1c;
  --card:rgba(30,20,66,.74); --cardb:rgba(42,30,88,.92); --ink:#f4f0ff; --muted:#b2aad8; --line:rgba(255,255,255,.13); --soft:rgba(255,255,255,.07);
  --accent:#a78bfa; --accent2:#f472b6; --accent3:#fbbf24; --accent-ink:#fff;
  --good:#4ade9a; --good-bg:rgba(52,211,153,.16); --bad:#fb7185; --bad-bg:rgba(251,113,133,.15);
  --gold:#fcd34d; --gold-bg:rgba(251,191,36,.16); --tip-bg:rgba(96,165,250,.15); --tip:#9cc2ff; --hi:rgba(250,204,21,.32);
  --l1:#3e3570; --l2:#d9a422; --l3:#3b82f6; --l4:#10b981;
  --glow:0 14px 44px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg2);color:var(--ink);font:17px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}

/* ---------- living background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3))}
.blob{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:normal;animation:drift 22s ease-in-out infinite alternate}
.b1{background:var(--blobA);top:-18vmax;left:-12vmax}
.b2{background:var(--blobB);top:20vh;right:-20vmax;animation-duration:27s;animation-delay:-6s}
.b3{background:var(--blobC);bottom:-22vmax;left:10vw;animation-duration:31s;animation-delay:-12s;opacity:.4}
.b4{background:var(--blobD);top:45vh;left:-18vmax;width:30vmax;height:30vmax;animation-duration:24s;animation-delay:-3s;opacity:.35}
@keyframes drift{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(8vw,6vh) scale(1.12) rotate(30deg)}100%{transform:translate(-6vw,10vh) scale(.92) rotate(-20deg)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.2px,transparent 1.4px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
.floaters span{position:absolute;bottom:-60px;color:var(--ink);opacity:.13;font-family:"Fredoka",system-ui,sans-serif;font-weight:700;animation:floatUp linear infinite;will-change:transform}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.edge{position:fixed;inset:0;pointer-events:none;z-index:39;opacity:0;box-shadow:inset 0 0 90px 20px var(--accent3);transition:opacity .25s}
.edge.on{opacity:.55}

/* ---------- layout ---------- */
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 60px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font:700 1.6rem/1.15 "Fredoka",system-ui,sans-serif;margin:0;letter-spacing:.01em;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 1.25rem "Fredoka",system-ui,sans-serif;margin:0 0 10px}
h3{font:700 1.05rem "Fredoka",system-ui,sans-serif;margin:22px 0 10px}
.steps{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.step{font:600 .78rem/1 "Fredoka",system-ui,sans-serif;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.step.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(236,72,153,.35)}
.step.done{color:var(--good);border-color:var(--good);background:var(--good-bg)}

/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lvl .badge{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 1.05rem "Fredoka",sans-serif;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(124,58,237,.35)}
.lvl .info{flex:1;min-width:0}
.lvl .t{font:600 .85rem "Fredoka",sans-serif;display:flex;justify-content:space-between;gap:8px}
.lvl .t span:last-child{color:var(--muted);font-weight:500}
.xpbar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px}
.xpbar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent3),var(--accent2),var(--accent));background-size:200% 100%;animation:shine 3s linear infinite;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes shine{to{background-position:-200% 0}}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font:600 .8rem "Fredoka",sans-serif;padding:6px 11px;border-radius:999px;color:#fff;display:inline-flex;gap:5px;align-items:center}
.stat b{font-weight:700}
.s1{background:var(--m4)} .s2{background:var(--m2)} .s3{background:var(--m3)} .s4{background:var(--m5)}
.stat.pop{animation:statpop .45s}
@keyframes statpop{40%{transform:scale(1.25)}}

/* ---------- main card ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px 22px;box-shadow:var(--glow);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--blobA),var(--blobB),var(--blobC),var(--blobD))}
.card.enter{animation:popIn .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.card.hit{animation:hitShake .4s}
@keyframes hitShake{20%{transform:translateX(-8px) rotate(-.6deg)}40%{transform:translateX(7px) rotate(.5deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.label{font:700 .74rem/1.3 "Fredoka",sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.label.new{color:var(--accent2)}
.prompt{font:700 2.3rem/1.15 "Fredoka",system-ui,sans-serif;margin:0 0 4px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
.forms{color:var(--muted);font-size:.95rem;margin-bottom:14px;min-height:1.2em}
.meaning{font:600 1.45rem "Fredoka",sans-serif;margin:4px 0 14px}
.q{font:600 1.2rem/1.4 "Fredoka",sans-serif;margin:0 0 14px}
.cue{font:600 .78rem "Fredoka",sans-serif;color:var(--muted);margin-bottom:6px}
.sentence{font:italic 1.35rem/1.45 Georgia,"Times New Roman",serif;margin:0 0 14px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:13px 15px;border:2px solid var(--line);border-radius:14px;background:var(--cardb);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input[type=date]{width:auto;padding:9px 10px;font:.95rem system-ui,sans-serif}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{font:600 .95rem/1.1 "Fredoka",system-ui,sans-serif;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--cardb);color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .15s,filter .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(91,63,190,.18)}
button:active:not(:disabled){transform:scale(.96)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(236,72,153,.32)}
button.small{font-size:.82rem;padding:8px 12px;border-radius:11px}
button:disabled{opacity:.5;cursor:default}
.kbd{font:500 .7rem system-ui,sans-serif;opacity:.75;margin-left:6px}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc button{text-align:left;font:600 1.02rem/1.3 "Fredoka",sans-serif;padding:14px;min-height:58px;border-width:2px;display:flex;gap:10px;align-items:center}
.mc button .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 .8rem "Fredoka",sans-serif;color:#fff}
.mc button:nth-child(1) .k{background:var(--m1)} .mc button:nth-child(2) .k{background:var(--m2)}
.mc button:nth-child(3) .k{background:var(--m3)} .mc button:nth-child(4) .k{background:var(--m4)}
.mc button.right{background:var(--good-bg);border-color:var(--good);color:var(--good);animation:bounce .4s}
.mc button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .3s}
@keyframes bounce{40%{transform:scale(1.06)}}
.mc.qs{grid-template-columns:1fr}
@media (max-width:480px){.mc{grid-template-columns:1fr}.prompt{font-size:1.9rem}}
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;animation:popIn .25s}
.fb.good{background:var(--good-bg);border:1px solid rgba(16,185,129,.3)} .fb.bad{background:var(--bad-bg);border:1px solid rgba(244,63,94,.28)}
.fb .head{font:700 1.05rem "Fredoka",sans-serif;margin-bottom:4px}
.fb.good .head{color:var(--good)} .fb.bad .head{color:var(--bad)}
.you{color:var(--muted);font-size:.95rem;margin-bottom:6px}
.hook,.why,.warn,.main{border-radius:12px;padding:9px 12px;margin-top:8px;font-size:.95rem}
.hook{background:var(--tip-bg);color:var(--tip)}
.why{background:var(--soft)}
.warn{background:var(--gold-bg);color:var(--gold)}
.main{border:1px dashed var(--line);color:var(--muted)}
.zap{background:linear-gradient(135deg,rgba(255,77,109,.18),rgba(139,92,246,.18));color:var(--bad);border-radius:12px;padding:9px 12px;margin-top:8px;font-weight:800}
.typeout{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.typeout p{margin:0 0 8px;font-size:.95rem}
.err{color:var(--bad);font:600 .85rem "Fredoka",sans-serif;margin-top:6px;min-height:1.2em}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
mark{background:var(--hi);color:inherit;border-radius:4px;padding:0 2px}
.idea{background:var(--hi);border-radius:12px;padding:9px 12px;margin-top:8px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys span{font:600 .8rem "Fredoka",sans-serif;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--cardb)}
.keys span.hit{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar > div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blobC),var(--good));transition:width .5s}
.units{display:grid;gap:8px;margin:8px 0 14px}
.unit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;cursor:pointer;background:var(--cardb);transition:border-color .15s,transform .12s}
.unit:hover{transform:translateY(-1px)}
.unit:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.13)}
.unit input{margin-top:5px;width:19px;height:19px;accent-color:var(--accent)}
.unit .t{font:700 1rem "Fredoka",sans-serif}
.unit .s{font-size:.82rem;color:var(--muted)}
.unit .grow{flex:1}
.unit .crown{font-size:1.2rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font:600 .82rem "Fredoka",sans-serif;padding:7px 12px;border-radius:999px;background:var(--cardb);border:1px solid var(--line)}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.banner.test{background:var(--bad-bg);color:var(--bad)}
.banner.rev{background:var(--tip-bg);color:var(--tip)}
.banner.calm{background:var(--good-bg);color:var(--good)}
.sub{font-size:.86rem;color:var(--muted)}
.tests{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tests span{font-size:.82rem;padding:5px 9px;border-radius:10px;background:var(--soft)}
.tests button{padding:0 0 0 6px;border:0;background:none;color:var(--muted);font-size:.85rem;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:16px}
.chip{position:relative;font:600 .8rem "Fredoka",sans-serif;padding:7px 9px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chip span{position:relative}
.legend{font-size:.78rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.center{text-align:center}
.big{font:700 1.45rem "Fredoka",sans-serif;margin:8px 0 12px}
.huge{font-size:3.4rem;line-height:1;margin:6px 0}
.gloss{margin-top:10px;font-size:.92rem;color:var(--muted)}
.tough{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tough span{font:600 .82rem "Fredoka",sans-serif;padding:5px 9px;border-radius:10px;background:var(--bad-bg);color:var(--bad)}
.foot{margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.foot button{font-size:.82rem;padding:8px 12px;background:var(--card)}
.tips{margin:10px 0 0;padding-left:20px;font-size:.95rem}
.tips li{margin-bottom:4px}

/* ---------- home: goal ring + arcade ---------- */
.homeTop{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 1.05rem/1.05 "Fredoka",sans-serif}
.ring .n small{display:block;font-size:.62rem;color:var(--muted);font-weight:600}
.ring.done{animation:glowPulse 1.8s ease-in-out infinite}
@keyframes glowPulse{50%{filter:drop-shadow(0 0 10px var(--accent3))}}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{position:relative;text-align:left;color:#fff;border:0;border-radius:18px;padding:14px;min-height:112px;display:flex;flex-direction:column;gap:3px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.mode::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.mode:hover::after{transform:translateX(120%)}
.mode .e{font-size:1.7rem;line-height:1}
.mode .t{font:700 1.02rem "Fredoka",sans-serif}
.mode .d{font-size:.78rem;opacity:.92;line-height:1.3}
.mode .best{margin-top:auto;font:600 .72rem "Fredoka",sans-serif;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:99px;align-self:flex-start}

/* ---------- arcade pieces ---------- */
.gametop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.score{font:700 1.5rem "Fredoka",sans-serif}
.mult{font:700 .9rem "Fredoka",sans-serif;padding:4px 10px;border-radius:99px;color:#fff;background:var(--m4)}
.mult.up{animation:statpop .4s}
.timer{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.timer div{height:100%;background:linear-gradient(90deg,var(--blobC),var(--accent3),var(--bad));background-size:300% 100%;transition:width .1s linear}
.hearts{font-size:1.35rem;letter-spacing:2px}
.hearts .lost{filter:grayscale(1);opacity:.35}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{min-height:76px;padding:10px;font:600 .92rem/1.25 "Fredoka",sans-serif;border-width:2px;display:grid;place-items:center;text-align:center;word-break:break-word}
.tile.la{color:var(--accent)}
.tile.sel{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(236,72,153,.2);transform:translateY(-2px)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.tile.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);animation:matched .5s forwards;pointer-events:none}
@keyframes matched{40%{transform:scale(1.1)}100%{transform:scale(.92);opacity:.35}}
.flip{perspective:1200px;margin:6px 0 12px;cursor:pointer}
.flip-inner{position:relative;min-height:220px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;border:2px solid var(--line);overflow:auto}
.face.front{background:var(--cardb)}
.face.back{background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(236,72,153,.14));transform:rotateY(180deg)}
.face .hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.boss{text-align:center;margin-bottom:12px}
.boss .face2{font-size:4rem;line-height:1.1;display:inline-block;transition:transform .2s}
.boss .face2.ouch{animation:ouch .45s}
@keyframes ouch{30%{transform:scale(.85) rotate(-10deg);filter:brightness(2) saturate(0)}60%{transform:scale(1.1) rotate(6deg)}}
.boss .nm{font:700 1rem "Fredoka",sans-serif}
.hp{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px auto 0;max-width:360px;border:1px solid var(--line)}
.hp div{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9a3d);transition:width .35s}
.dmg{position:fixed;z-index:45;font:800 1.6rem "Fredoka",sans-serif;color:#ff4d6d;text-shadow:0 2px 0 #fff;pointer-events:none;animation:floatOut 1s forwards}

/* ---------- overlays, toasts, popups ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,8,40,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--cardb);border-radius:22px;max-width:640px;width:100%;padding:20px;animation:popIn .3s;border:1px solid var(--line)}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem}
.sheet td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:first-child{font-weight:700;color:var(--accent)}
.sheet .h{color:var(--tip);font-size:.85rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{border-radius:16px;padding:12px;text-align:center;border:1px solid var(--line);background:var(--card)}
.bdg .e{font-size:2rem}
.bdg .n{font:700 .9rem "Fredoka",sans-serif}
.bdg .d{font-size:.75rem;color:var(--muted)}
.bdg.locked{filter:grayscale(1);opacity:.45}
.bdg.got{background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(236,72,153,.15));border-color:rgba(251,191,36,.5)}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:16px;color:#fff;font:700 .95rem "Fredoka",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .45s cubic-bezier(.2,1.4,.4,1),toastOut .4s 2.8s forwards}
.toast .e{font-size:1.5rem}
.toast small{display:block;font-weight:500;opacity:.9;font-size:.78rem}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.8)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.9)}}
.xp-pop{position:fixed;z-index:45;font:800 1.15rem "Fredoka",sans-serif;color:var(--accent3);text-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none;animation:floatOut 1.1s forwards}
@keyframes floatOut{from{opacity:0;transform:translateY(6px) scale(.7)}20%{opacity:1;transform:translateY(-6px) scale(1.15)}to{opacity:0;transform:translateY(-56px) scale(1)}}
.burst-text{position:fixed;left:50%;top:38%;z-index:46;transform:translate(-50%,-50%);font:800 clamp(1.8rem,7vw,3.2rem)/1.1 "Fredoka",sans-serif;text-align:center;pointer-events:none;background:linear-gradient(90deg,#ffd166,#ff6b9d,#a78bfa,#38bdf8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25));animation:burstText 1.6s cubic-bezier(.2,1.3,.4,1) forwards,shine 1.2s linear infinite;white-space:nowrap}
@keyframes burstText{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
.lvlup .sheet{text-align:center;max-width:380px;margin-top:12vh;background:linear-gradient(160deg,var(--cardb),var(--card))}
.lvlup .ring2{width:110px;height:110px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font:800 2.8rem "Fredoka",sans-serif;color:#fff;background:conic-gradient(from 0deg,#ff6b9d,#ffd166,#34d399,#38bdf8,#a78bfa,#ff6b9d);animation:spinIn .9s cubic-bezier(.2,1.3,.4,1)}
.lvlup .ring2 span{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2))}
@keyframes spinIn{from{transform:scale(.2) rotate(-180deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .blob,.floaters span,.xpbar div,.ring.done{animation:none}
  .card.enter,.fb,.toast,.burst-text,.sheet{animation-duration:.01s}
}
</style>

<script>
/* ================= Study material ================= */
const SUBJECT = "Latin Vocab Trainer";
const KEY = "studytrain_latin_vocab";

const UNITS = [
 {id:"A", title:"List A · aliquid → fortasse", pages:"10 words", main:"Can you go from Latin to English and back without stopping to think?"},
 {id:"B", title:"List B · fortūna → nox", pages:"11 words", main:"Can you go from Latin to English and back without stopping to think?"},
 {id:"C", title:"List C · obstō → saeviō", pages:"12 words", main:"Can you go from Latin to English and back without stopping to think?"},
 {id:"G", title:"Grammar & look-alikes", pages:"6 ideas", main:"Why do these words behave the way they do in a sentence?"}
];

/* la, forms, m = meaning shown on backward cards, en = accepted answers, h = hook, d = why it matters, w = warning */
const VOCAB = [
 {u:"A",la:"aliquid",f:"",m:"something, anything",en:["something","anything"],h:"ali-QUID: quid = what. Some-what = SOMETHING.",d:"Latin uses it whenever something new or unknown turns up in a story."},
 {u:"A",la:"audeō",f:"audēre, —, ausus sum",m:"to dare",en:["to dare","dare"],h:"AUDacious people DARE to do things.",d:"English words from it: audacious, audacity.",w:"Don't mix it up with audiō (to hear). audeō has an E: dare."},
 {u:"A",la:"caput",f:"capitis (n.)",m:"head",en:["head"],h:"You wear a CAP on your HEAD. The CAPtain is the head of the ship.",d:"English words from it: capital, captain, chef, decapitate."},
 {u:"A",la:"coepī",f:"coepisse",m:"I began",en:["i began","began","i have begun","i started","started"],h:"It only shows up in the past: coepī = I BEGAN.",d:"Pairs with an infinitive: saevīre coepērunt = they began to rage.",w:"coepit = he/she began, coepērunt = they began."},
 {u:"A",la:"cognōscō",f:"cognōscere, cognōvī, cognitus",m:"to find out, get to know",en:["to find out","to get to know","to learn","to know","to recognize","find out"],h:"reCOGNize, COGNitive. Getting your brain to KNOW something = FIND OUT.",d:"English words from it: cognitive, recognize."},
 {u:"A",la:"cōnsistō",f:"cōnsistere, cōnstitī",m:"to stand firm",en:["to stand firm","to stand one's ground","to stand ground","to stand","stand firm"],h:"A CONSISTent player doesn't back down. They STAND FIRM.",d:"Battle stories use it when soldiers hold their ground."},
 {u:"A",la:"dea",f:"deae (f.)",m:"goddess",en:["goddess"],h:"DEity = a god. deus = god, dea = GODDESS (the -a ending is feminine).",d:"English words from it: deity, deify."},
 {u:"A",la:"dēmōnstrō",f:"dēmōnstrāre, dēmōnstrāvī, dēmōnstrātus",m:"to show, point out",en:["to show","to point out","to demonstrate","show"],h:"DEMONSTRATE = SHOW how it's done.",d:"English words from it: demonstrate, demonstration."},
 {u:"A",la:"discēdō",f:"discēdere, discessī, discessus",m:"to leave, depart",en:["to leave","to depart","to go away","leave","depart"],h:"dis- (apart) + cēdō (go). Go apart = LEAVE.",d:"One of the most common verbs for moving away in Latin stories."},
 {u:"A",la:"fortasse",f:"",m:"perhaps",en:["perhaps","maybe"],h:"Comes from forte (by chance). By chance... = PERHAPS.",d:"Softens a statement, just like 'maybe' in English."},
 {u:"B",la:"fortūna",f:"fortūnae (f.)",m:"fortune, luck",en:["fortune","luck"],h:"Looks just like FORTUNE. Good fortune = good LUCK.",d:"English words from it: fortune, fortunate."},
 {u:"B",la:"frangō",f:"frangere, frēgī, frāctus",m:"to break",en:["to break","break"],h:"A FRACTURE is a BREAK. FRAGile things BREAK easily.",d:"English words from it: fracture, fragile, infringe."},
 {u:"B",la:"ibi",f:"",m:"there",en:["there"],h:"Point and say 'ibi!' = THERE.",d:"Points back to a place the story already mentioned."},
 {u:"B",la:"invītus",f:"invīta, invītum",m:"unwilling(ly)",en:["unwillingly","unwilling"],h:"in- (NOT) + vīt- (want). Not wanting to = UNWILLINGLY.",d:"The opposite of libenter (gladly).",w:"It does NOT mean 'invited'."},
 {u:"B",la:"libenter",f:"",m:"gladly, willingly",en:["gladly","willingly","happily"],h:"Think LIBerty: you do it freely, so you do it GLADLY.",d:"The opposite of invītus (unwillingly)."},
 {u:"B",la:"longus",f:"longa, longum",m:"long",en:["long"],h:"longus = LONG. Easy one!",d:"English words from it: longitude, longevity."},
 {u:"B",la:"manus",f:"manūs (f.)",m:"hand; band of men",en:["hand","band of men","band","group of men"],h:"MANual = done by HAND. Soldiers working together are a 'hand' = BAND OF MEN.",d:"English words from it: manual, manufacture, maneuver.",w:"Not caput (head). manus = hand / band."},
 {u:"B",la:"mīles",f:"mīlitis (m.)",m:"soldier",en:["soldier"],h:"MILitary = SOLDIERS. mīlitēs = soldiers.",d:"English words from it: military, militant.",w:"Not 'mile' and not mīlle (thousand)."},
 {u:"B",la:"nam",f:"",m:"for (because)",en:["for","because"],h:"nam gives a reason: 'I stayed, NAM (FOR) it was raining.'",d:"Introduces the reason for what was just said.",w:"nam = for (because). prō = for (in front of / on behalf of)."},
 {u:"B",la:"nēmō",f:"",m:"no one",en:["no one","nobody","noone"],h:"Finding NEMO: for a long time, NO ONE could find him.",d:"A very common subject: nēmō audet = no one dares."},
 {u:"B",la:"nox",f:"noctis (f.)",m:"night",en:["night"],h:"NOCturnal animals come out at NIGHT. nocte = at night.",d:"English words from it: nocturnal, nocturne."},
 {u:"C",la:"obstō",f:"obstāre, obstitī (+ dat.)",m:"to block, stand in the way",en:["to block","to obstruct","to stand in the way","block"],h:"An OBSTacle BLOCKS your way. ob (in the way) + stō (stand).",d:"English word from it: obstacle.",w:"It takes the dative: viae obstitit = he blocked the road."},
 {u:"C",la:"pars",f:"partis (f.)",m:"part",en:["part"],h:"pars = PART. partem, partis are just other forms.",d:"English words from it: part, particle, participate."},
 {u:"C",la:"perīculōsus",f:"perīculōsa, perīculōsum",m:"dangerous",en:["dangerous","perilous"],h:"PERILous = full of PERIL = DANGEROUS. -ōsus means 'full of'.",d:"English word from it: perilous."},
 {u:"C",la:"petō",f:"petere, petīvī, petītus",m:"to ask for, seek, attack",en:["to ask for","to seek","to attack","to beg for","to head for","to ask","seek","attack"],h:"A PETITION ASKS FOR something. You go after it: SEEK, HEAD FOR, even ATTACK.",d:"English words from it: petition, compete, appetite."},
 {u:"C",la:"posteā",f:"",m:"afterwards",en:["afterwards","afterward","later"],h:"POST- = after (post-game). posteā = AFTERWARDS.",d:"Moves a story forward in time.",w:"posteā = afterwards. postrēmō = finally (the very last)."},

 {u:"C",la:"prō",f:"(+ abl.)",m:"in front of; on behalf of",en:["in front of","on behalf of","before","for"],h:"The PROtagonist is the one IN FRONT of the story.",d:"English word from it: protagonist. It takes the ablative.",w:"prō + ablative: prō templō = in front of the temple."},
 {u:"C",la:"quō?",f:"",m:"where (to)?",en:["where","to where","where to","whither"],h:"'Quō vādis?' = WHERE are you going? It asks where TO.",d:"Asks about the direction someone is heading."},
 {u:"C",la:"recūsō",f:"recūsāre, recūsāvī, recūsātus",m:"to refuse",en:["to refuse","refuse"],h:"A judge RECUSES himself: he REFUSES to take the case.",d:"English word from it: recuse."},
 {u:"C",la:"sacer",f:"sacra, sacrum",m:"sacred, holy",en:["sacred","holy"],h:"SACer = SACred. A SACrifice is a sacred offering.",d:"English words from it: sacred, sacrifice, sacrilege."},
 {u:"C",la:"saeviō",f:"saevīre, saeviī, saevītus",m:"to be in a rage",en:["to be in a rage","to rage","to be enraged","to be angry","rage"],h:"saeviō sounds like SAVAGE. A savage beast is IN A RAGE.",d:"English word from it: savage."}
];

/* Explain items: forward = question → short answer; backward = answer → explain it in your own words */
const GRAMMAR = [
 {u:"G",q:"Which case does obstō use for the thing being blocked?",a:["dative","the dative","dative case"],h:"Think 'stand in the way TO someone': TO/FOR words go in the dative.",d:"Verbs of blocking or resisting take the dative, so viae obstitit means he blocked the road.",w:"Not the accusative: viam obstitit is wrong.",mc:["accusative","ablative","genitive"]},
 {u:"G",q:"Which case follows the preposition prō?",a:["ablative","the ablative","ablative case"],h:"PRŌ and ABLative both start in front: the ABLE guard stands PRŌ (in front of) the gate.",d:"prō takes the ablative, so prō templō means in front of the temple.",w:"ad and per take the accusative; prō does not.",mc:["accusative","dative","genitive"]},
 {u:"G",q:"What does the ending -ōsus add to a noun, as in perīculōsus?",a:["full of"],h:"-ōsus ≈ English -ous: dangerOUS, gloriOUS = FULL OF.",d:"It turns a noun into an adjective: perīculum, danger, becomes perīculōsus, dangerous.",mc:["without","a little","the opposite of"]},
 {u:"G",q:"Which Latin verb, easily confused with audeō (to dare), means to hear?",a:["audiō","audio"],h:"audIō has an I, like audIo speakers: you HEAR them.",d:"audiō gives English audio and audience, while audeō gives audacious.",w:"audeō (E) = dare, audiō (I) = hear.",mc:["audeō","videō","adeō"]},
 {u:"G",q:"In which tense does coepī (I began) appear?",a:["perfect","the perfect","perfect tense"],h:"coepī is already DONE (it began), so it lives only in the PERFECT.",d:"coepī has only perfect forms: coepit means he began and coepērunt means they began.",mc:["present","future","imperfect"]},
 {u:"G",q:"What does the prefix dis- mean in discēdō (to leave)?",a:["apart","away"],h:"DIStant, DISmiss: things moving APART.",d:"dis- plus cēdō, go, means go apart, so discēdō is to leave or depart.",mc:["together","again","toward"]}
];

/* Apply: translation sentences (w = words used) and explain questions */
const SENTENCES = [
 {la:"Nox longa et perīculōsa erat.",en:"The night was long and dangerous.",g:"nox = night · longa = long · perīculōsa = dangerous · erat = was",w:"nox longus periculosus"},
 {la:"Ibi mīlitēs saevīre coepērunt.",en:"There the soldiers began to rage.",g:"ibi = there · mīlitēs = soldiers · saevīre = to rage · coepērunt = they began",w:"ibi miles saevio coepi"},
 {la:"Mīlitēs libenter discessērunt.",en:"The soldiers gladly departed.",g:"mīlitēs = soldiers · libenter = gladly · discessērunt = they departed",w:"miles libenter discedo"},

 {la:"Fortasse dea nōbīs praesidium dabit.",en:"Perhaps the goddess will give us protection.",g:"fortasse = perhaps · dea = goddess · nōbīs = (to) us · praesidium = protection · dabit = will give",w:"fortasse dea praesidium"},
 {la:"Posteā mīles aliquid novum cognōvit.",en:"Afterwards the soldier found out something new.",g:"posteā = afterwards · mīles = soldier · aliquid = something · novum = new · cognōvit = found out",w:"postea miles aliquid cognosco"},

 {la:"Nēmō fortūnam suam cognōscere potest.",en:"No one can know his own fortune.",g:"nēmō = no one · fortūnam = fortune · suam = his own · cognōscere = to know · potest = can",w:"nemo fortuna cognosco"},
 {la:"Mīlitēs nocte urbem petīvērunt.",en:"At night the soldiers attacked the city.",g:"nocte = at night · urbem = city · petīvērunt = attacked",w:"miles nox peto"},
 {la:"Puer libenter templum sacrum deae dēmōnstrāvit.",en:"The boy gladly showed the sacred temple of the goddess.",g:"puer = boy · libenter = gladly · templum sacrum = sacred temple · deae = of the goddess · dēmōnstrāvit = showed",w:"libenter sacer dea demonstro"},
 {la:"Postrēmō rēx invītus pācem petīvit.",en:"Finally the king unwillingly asked for peace.",g:"postrēmō = finally · rēx = king · invītus = unwillingly · pācem = peace · petīvit = asked for",w:"postremo invitus peto"},

const DAY = 864e5, POOL = 10;
const $ = id => document.getElementById(id);

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const now = () => Date.now() + (window.__clockOffset || 0);
function dayStart(t){ const d=new Date(t); if(d.getHours()<4) d.setDate(d.getDate()-1); d.setHours(4,0,0,0); return d.getTime(); }
function addDays(t,n){ const d=new Date(t); d.setDate(d.getDate()+n); d.setHours(4,0,0,0); return d.getTime(); }
function dayKey(t){ const d=new Date(dayStart(t)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateAt4(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d,4,0,0,0).getTime(); }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }

function norm(s){
  s = String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/['’\-]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  let prev; do { prev=s; s=s.replace(/^(to|the|a|an|i) /,""); } while(s!==prev);
  return s;
}
function lev(a,b){ if(a===b) return 0; const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]; }
const NEG = ["in","un","non","im","il","ir"];
function negFlip(x,y){ return NEG.some(p => x===p+y || y===p+x); }
const ALL_ANS = new Set();
ITEMS.forEach(it => { it.a.forEach(x=>ALL_ANS.add(norm(x))); (it.rb||[]).forEach(x=>ALL_ANS.add(norm(x))); });
function matchOne(p, t){
  if(!p || !t) return false;
  if(p===t) return true;
  if(/\d/.test(t) || /\d/.test(p)) return false;
  if(negFlip(p,t)) return false;
  const tol = t.length<5 ? 0 : t.length<=8 ? 1 : 2;
  if(lev(p,t)<=tol) return true;
  if(t.length>=4){ const pw=p.split(" "), tw=t.split(" ");
    if(pw.length>tw.length && pw.length-tw.length<=3 && (" "+p+" ").includes(" "+t+" ")) return true; }
  return false;
}
/* typed answer vs a list of accepted answers */
function checkAns(typed, accepted){
  const acc = accepted.map(norm);
  const whole = norm(typed);
  if(!whole) return false;
  if(acc.includes(whole)) return true;
  if(ALL_ANS.has(whole)) return false;            // exactly another item's answer = a look-alike, not a typo
  const parts = String(typed).split(/[,;\/]| or /i).map(norm).filter(Boolean);
  return parts.some(p => acc.includes(p) || (!ALL_ANS.has(p) && acc.some(t => matchOne(p,t))));
}

/* backward "explain it" grading */
const STOP = new Set(("the a an and or but of to in on at for with by from as is are was were be been being this that these those which what who whom whose where when why how it its they them their there then than so such not no do does did can could would should will shall may might must have has had into about over under also very more most some any each other like just only your you our we he she his her him use used uses one two thing things word words means mean meaning so while same"+
  " take takes taken").split(" "));
const stem = w => w.slice(0,5);
function keysFor(it){
  if(it._keys) return it._keys;
  const src = it.k ? it.k.join(" ") : it.q + " " + (it.d||"");
  const ansStems = new Set(it.a.flatMap(x => norm(x).split(" ")).map(stem));
  const seen = new Set(), out = [];
  norm(src).split(" ").forEach(w => {
    if(w.length<4 || STOP.has(w)) return; const s=stem(w);
    if(ansStems.has(s) || seen.has(s)) return; seen.add(s); out.push({w, s});
  });
  return it._keys = out;
}
function gradeExplain(it, typed){
  const words = norm(typed).split(" ").filter(w => w.length>=3 && !STOP.has(w));
  const keys = keysFor(it);
  const hits = keys.filter(k => words.some(t => stem(t)===k.s || (t.length>=6 && k.w.length>=6 && lev(t,k.w)<=1)));
  return {hits, keys, need2:Math.min(2,keys.length), need3:Math.min(3,keys.length)};
}
function overlap(typed, model){
  const toks = s => norm(s.replace(/\(.*?\)/g,"")).split(" ").filter(Boolean);
  const a = toks(typed), b = toks(model); if(!b.length) return 0;
  let hit=0; b.forEach(t => { if(a.some(x => x===t || (t.length>=5 && lev(x,t)<=1))) hit++; });
  return hit/b.length;
}
function highlight(text, hits){
  const ss = new Set(hits.map(h=>h.s));
  return esc(text).split(/(\s+)/).map(w => { const n=norm(w); return n && ss.has(stem(n)) ? `<mark>${w}</mark>` : w; }).join("");
}

function freshState(){

  return {v:2, c, intro:{}, hooks:{}, miss:{}, st:{r:0,w:0,streak:0,best:0}, day:{last:null,n:0,best:0}, tests:[], sel:["A"], stage:{}, step:0,
    xp:0, badges:{}, best:{}, goal:{day:null,n:0,hit:false}, opt:{sound:true}, unitDone:{}, cnt:{fixes:0}};
}
function migrate(s){
  if(!s || typeof s!=="object" || !s.c) return null;
  const f = freshState();
  for(const k in f) if(s[k]===undefined) s[k]=f[k];
  for(const id in f.c){
    const c = s.c[id] = Object.assign({}, f.c[id], s.c[id]||{});
    if(c.sch){ // older saves: fill in missing schedule fields
      c.sch.ivl = Math.max(1, Math.min(365, +c.sch.ivl || 1));
      c.sch.ease = Math.max(1.3, Math.min(3, +c.sch.ease || 2.5));
      c.sch.lapses = +c.sch.lapses || 0;
      c.sch.due = +c.sch.due ? dayStart(+c.sch.due) : addDays(dayStart(now()), c.sch.ivl);
    }
  }
  if(!Array.isArray(s.sel) || !s.sel.length) s.sel=["A"];
  s.sel = s.sel.filter(u => UNIT[u]); if(!s.sel.length) s.sel=["A"];
  s.v = 2; return s;
}

/* ================= Scheduling ================= */
function clampTests(){
  const t0 = now();
  S.tests = S.tests.filter(t => dateAt4(t.date) >= dayStart(t0));
  S.tests.forEach(t => {
    const lim = addDays(dateAt4(t.date), -1);
    if(lim <= t0) return;
    cardsOf(itemsOf(t.units)).forEach(id => { const s=S.c[id].sch; if(s && s.due>lim) s.due=lim; });
  });
}
function scheduleNew(id){
  const c = S.c[id];
  c.sch = {ivl:1, ease:Math.max(1.5, 2.5-0.15*c.m), lapses:0, due:addDays(dayStart(now()),1)};
  clampTests();
}
function reviewUpdate(id, ok, sure){
  const s = S.c[id].sch; if(!s) return;
  if(ok && sure){ s.ivl = s.ivl<=1 ? 3 : Math.round(s.ivl*s.ease*(0.95+Math.random()*0.1)); s.ease=Math.min(3, s.ease+0.05); }
  else if(ok){ s.ivl = Math.max(1, Math.round(s.ivl*1.2)); s.ease=Math.max(1.3, s.ease-0.15); }
  else { s.lapses++; s.ease=Math.max(1.3, s.ease-0.2); s.ivl=1; }
  s.ivl = Math.min(365, Math.max(1, s.ivl));
  s.due = addDays(dayStart(now()), s.ivl);
  clampTests();
}
const dueCards = () => Object.keys(S.c).filter(id => S.c[id].sch && S.c[id].sch.due <= now());

  const k = dayKey(now());

}

    main.querySelectorAll("[data-mode]").forEach(b => { const m=MODES.find(x=>x.id===b.dataset.mode); b.querySelector(".best").textContent = m.best(); });
  });
  bind("#learnBtn", startLearn);
  bind("#cramBtn", cramSetup);
  main.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => MODES.find(m => m.id===b.dataset.mode).go());
  bind("#revBtn", () => startReview(false));
  main.querySelectorAll("[data-cram]").forEach(b => b.onclick = () => { S.sel = S.tests[+b.dataset.cram].units.slice(); save(); cramSetup(); });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = e => { e.preventDefault(); S.tests.splice(+b.dataset.del,1); save(); home(); });
  bind("#setTest", () => {
    const v = $("testDate").value;
    if(!v){ $("err").textContent="Pick a date first."; return; }
    if(dateAt4(v) < dayStart(now())){ $("err").textContent="That date is in the past."; return; }
    S.tests = S.tests.filter(t => !(t.date===v));
    S.tests.push({date:v, units:S.sel.slice().sort()});
    clampTests(); save(); home();
  });
}

/* ================= Learn ================= */
function startLearn(){
  const st = S.stage[selKey()] || "learn";
  if(st==="apply") return startApply();
  if(st==="hub") return hub();
  SS = {mode:"learn", last:null}; learnNext();
}
function pickLearn(){
  const its = selItems(), active = [];
  its.forEach(i => { if(S.intro[i]) for(const d of ["f","r"]){ const id=i+"|"+d; if(S.c[id].l<4) active.push(id); } });
  const fresh = its.filter(i => !S.intro[i]);
  if(!active.length && !fresh.length) return {done:true};
  const ready = active.filter(id => S.c[id].nx<=S.step && id!==SS.last).sort((a,b)=>S.c[a].nx-S.c[b].nx);
  if(fresh.length && (active.length<4 || (!ready.length && active.length<POOL))) return {intro:fresh[0]};
  if(ready.length) return {id:ready[0]};
  const rest = active.filter(id => id!==SS.last).sort((a,b)=>S.c[a].nx-S.c[b].nx);
  if(rest.length){ S.step = Math.max(S.step, S.c[rest[0]].nx); return {id:rest[0]}; }
  return {id:active[0]};
}
function learnNext(){
  SS.mode = "learn";
  const p = pickLearn();
  if(p.done) return learnDone();
  if(p.intro!=null) return introGuess(p.intro);
  SS.last = p.id; showCard(p.id, "learn");
}
function learnDone(){
  SS.mode="learn";
  const n = cardsOf(selItems()).length;
  show(`<div class="center"><div class="big">🎉 All ${n} cards mastered, both directions!</div><p>Next: the final test. Every card, shuffled, no hints. You need a perfect score to unlock Apply.</p>
    <div class="row" style="justify-content:center"><button class="primary" id="go">Start final test<span class="kbd">Enter</span></button></div></div>`,
    enterTo(startTest));
  bind("#go", startTest);
  celebrate("learnDone");
}

/* --- new item intro: guess → reveal → type once --- */
function introGuess(i){
  SS.mode="intro"; SS.cur=i+"|f";
  const it = ITEMS[i];
  show(`<div class="label new">New ${it.kind==="v"?"word":"idea"} · guess first (blank is fine)</div>${promptHTML(i+"|f").replace(/<div class="label">.*?<\/div>/,"")}

}
function introReveal(i, guess){
  const it = ITEMS[i];
  const right = guess.trim() && checkAns(guess, it.a);
  const both = it.kind==="v" ? `${esc(it.la)} → ${esc(it.m)} and ${esc(it.m)} → ${esc(it.la)}` : `the question → <b>${esc(it.a[0])}</b>, and <b>${esc(it.a[0])}</b> → explaining it`;
  show(`<div class="label new">New ${it.kind==="v"?"word":"idea"}</div>${promptHTML(i+"|f").replace(/<div class="label">.*?<\/div>/,"")}
    <div class="fb ${right?"good":"good"}"><div class="head">${guess.trim()?(right?"✓ Great guess!":"Here's the answer"):"Here's the answer"}</div>
      ${guess.trim()&&!right?`<div class="you">You guessed: ${esc(guess)}</div>`:""}
      <div class="meaning" style="margin:0">${esc(fwdAnswer(it))}</div></div>
    ${hookHTML(i)}${whyHTML(i)}${warnHTML(i)}

    <div class="main">⇄ You'll practice this both ways: ${both}.</div>
    <div class="typeout"><p>Type it once to lock it in:</p><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="err" id="err"></div>
    <div class="row"><button class="primary" id="go">Got it<span class="kbd">Enter</span></button></div></div>`,

  bind("#go", go);
  function go(){

    S.intro[i]=true; S.step++; badge("first");
    const f=S.c[i+"|f"], r=S.c[i+"|r"];
    f.l=Math.max(f.l,1); r.l=Math.max(r.l,1); f.nx=S.step+2; r.nx=S.step+rint(4,5);

}

/* --- show a card (learn levels 1-3, or typed for review / cram / practice) --- */
function showCard(id, mode){
  SS.cur=id;
  const c=S.c[id], it=ITEMS[itemOf(id)], i=itemOf(id);
  const lvl = mode==="learn" ? c.l : 3;
  const tag = mode==="learn" ? `Level ${lvl} of 3` : mode==="review" ? "Review" : mode==="cram" ? "⚡ Cram" : "Practice";
  if(lvl===1) return showMC(id, mode, tag);
  show(`<div class="label">${tag}${mode==="cram"?` · ${SS.q.length} left`:mode==="review"?` · ${SS.q.length} left`:""}</div>${promptHTML(id, lvl===2)}
    ${inputHTML(id)}${confButtons()}`,
    enterTo(sh => submit(!sh)), "#ans");
  bind("#sure", () => submit(true)); bind("#guess", () => submit(false));
  function submit(sure){
    const typed=$("ans").value;
    if(!typed.trim()){ $("err").textContent = isExplain(id) ? "Write a sentence explaining it." : "Type an answer (or your best guess)."; shake($("ans")); return; }
    const r = gradeCard(id, typed);
    result(id, mode, r.ok, sure, typed, r.g);
  }
}
function mcOptions(id){
  const it=ITEMS[itemOf(id)], i=itemOf(id), d=dirOf(id);
  let right, opts, qs=false;
  if(d==="f"){
    right = fwdAnswer(it).split(", ")[0];
    let others = it.mc ? it.mc.slice() : shuffle(ITEMS.filter((x,k)=>k!==i && x.kind===it.kind)).slice(0,3).map(x=>x.a[0]);
    opts = shuffle([right, ...others.slice(0,3)]);
  } else if(it.kind==="v"){
    right = it.la;
    const pool = ITEMS.filter((x,k)=>k!==i && x.kind==="v");
    const look = shuffle(pool.filter(x => norm(x.la)[0]===norm(it.la)[0])).slice(0,2);
    const rest = shuffle(pool.filter(x => !look.includes(x))).slice(0,3-look.length);
    opts = shuffle([right, ...look.concat(rest).map(x=>x.la)]);
  } else {
    qs = true; right = it.q;
    opts = shuffle([right, ...shuffle(ITEMS.filter((x,k)=>k!==i && x.kind==="e")).slice(0,3).map(x=>x.q)]);
  }
  return {right, opts, qs};
}
function showMC(id, mode, tag){
  const {right, opts, qs} = mcOptions(id);
  show(`<div class="label">${tag} · pick one</div>${promptHTML(id, mode==="learn")}${qs?`<div class="forms" style="margin-top:-8px">Which question does this answer?</div>`:""}
    <div class="mc ${qs?"qs":""}">${opts.map((o,k)=>`<button data-k="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`,
    e => { const n=+e.key; if(n>=1 && n<=opts.length){ e.preventDefault(); pick(n-1); } });
  const btns=[...main.querySelectorAll(".mc button")];
  btns.forEach(b => b.onclick = () => pick(+b.dataset.k));
  let done=false;
  function pick(k){
    if(done) return; done=true;
    const ok = opts[k]===right;
    btns.forEach((b,j)=>{ b.disabled=true; if(opts[j]===right) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
    setTimeout(() => result(id, mode, ok, true, opts[k], null, true), ok?450:650);
  }
}

/* --- after an answer --- */
function result(id, mode, ok, sure, typed, g, wasMC){
  const i=itemOf(id), c=S.c[id];
  tally(ok, i);
  const confidentMiss = !ok && sure && !wasMC;
  if(mode==="learn"){
    S.step++;
    let gap;
    if(ok && sure){ c.l=Math.min(4,c.l+1); if(c.l===4){ scheduleNew(id); onMastered(id); } gap = c.l<=1?rint(2,3):c.l===2?rint(3,5):rint(6,9); }
    else if(ok){ gap = rint(2,4); }
    else { c.m++; c.l=Math.max(1,c.l-1); gap = confidentMiss ? rint(1,2) : c.l<=1?rint(2,3):c.l===2?rint(3,5):rint(6,9); }
    c.nx = S.step+gap; save();
    return ok ? correctScreen(id, sure, typed, g, learnNext, c.l===4) : correction(id, typed, confidentMiss, learnNext);
  }
  if(mode==="review" || mode==="practice"){
    const again = SS.again.has(id);
    if(!ok){ c.m++; if(!again && mode==="review") reviewUpdate(id,false,sure); SS.again.add(id); insertAt(SS.q, id, rint(3,5)); save(); return correction(id, typed, confidentMiss, nextQ); }
    if(!again && mode==="review") reviewUpdate(id, true, sure);
    save(); return correctScreen(id, sure, typed, g, nextQ);
  }
  if(mode==="cram"){
    const run = SS.run[id] = SS.run[id]||0;
    if(ok && sure){ SS.run[id]++; if(SS.run[id]>=2) cramComplete(id); else insertAt(SS.q, id, rint(5,8)); save(); return correctScreen(id, sure, typed, g, nextQ); }
    if(ok){ SS.run[id]=0; insertAt(SS.q, id, rint(3,5)); save(); return correctScreen(id, sure, typed, g, nextQ); }
    SS.run[id]=0; c.m++;
    if(c.sch){ const s=c.sch; s.lapses++; s.ease=Math.max(1.3,s.ease-0.2); s.ivl=1; s.due=addDays(dayStart(now()),1); clampTests(); }
    SS.missed.add(id);
    insertAt(SS.q, id, rint(2,3)); save();
    return correction(id, typed, confidentMiss, nextQ);
  }
}
function nextQ(){ SS.mode==="cram" ? cramNext() : reviewNext(); }
function insertAt(q, id, pos){ q.splice(Math.min(pos-1, q.length), 0, id); }

const CHEERS = ["✓ Correct!","✓ Nice!","✓ Yes!","✓ You got it!","✓ Nailed it!","✓ Brilliant!","✓ Optimē!","✓ Too easy!"];
function correctScreen(id, sure, typed, g, next, justMastered){
  const it=ITEMS[itemOf(id)], i=itemOf(id);
  let body;
  if(g){
    body = `<div class="you">You wrote: ${highlight(typed, g.hits)}</div><div class="idea">${esc(fullIdea(it))}</div>
      <div class="keys">${g.keys.map(k=>`<span class="${g.hits.includes(k)?"hit":""}">${esc(k.w)}</span>`).join("")}</div>`;
  } else body = `<div class="meaning" style="margin:0">${esc(dirOf(id)==="f"?fwdAnswer(it):revAnswer(it))}</div>`;
  const msg = !sure ? "✓ Right, and you guessed. It'll come back soon to lock it in." : justMastered ? "✓ Mastered! ⭐" : CHEERS[rint(0,CHEERS.length-1)];
  show(`${promptHTML(id)}<div class="fb good"><div class="head">${msg}${S.st.streak>=5&&sure?` 🔥 ${S.st.streak}`:""}</div>${body}</div>${hookHTML(i)}
    <div class="row"><button class="primary" id="go">Continue<span class="kbd">Enter</span></button></div>`,
    enterTo(next));
  bind("#go", next);
}
/* after any miss: compare, then type it out (or re-explain with the key words) */
function correction(id, typed, confident, next){
  SS.cur=id;
  const it=ITEMS[itemOf(id)], i=itemOf(id), exp=isExplain(id);
  const g = exp ? gradeExplain(it, typed||"") : null;
  const leech = (S.miss[i]||0)>=3 && !S.hooks[i];
  const answer = exp ? `<div class="idea">${esc(fullIdea(it))}</div><div class="keys">${g.keys.map(k=>`<span class="${g.hits.includes(k)?"hit":""}">${esc(k.w)}</span>`).join("")}</div>`
                     : `<div class="meaning" style="margin:0">${esc(dirOf(id)==="f"?fwdAnswer(it):revAnswer(it))}</div>`;
  show(`${promptHTML(id)}<div class="fb bad"><div class="head">✗ Not quite</div>${typed?`<div class="you">You ${exp?"wrote":"answered"}: ${esc(typed)}</div>`:""}<div class="sub">Right answer:</div>${answer}</div>
    ${confident?`<div class="zap">⚡ Surprise mistake! You were sure, so this one will stick once you fix it. It's coming back very soon.</div>`:""}
    ${hookHTML(i)}${warnHTML(i)}
    <div class="typeout"><p>${exp?`Explain it again using at least ${g.need3} of the key words:`:"Type the right answer to continue:"}</p>${inputHTML(id, exp?"Re-explain it…":"Type the right answer")}<div class="err" id="err"></div>
    ${leech?`<p style="margin-top:12px">✍️ This one keeps slipping. Write your own memory hook (optional):</p><input type="text" id="ownHook" placeholder="e.g. a picture, a rhyme, a joke">`:""}
    <div class="row"><button class="primary" id="go">Continue<span class="kbd">Enter</span></button></div></div>`,
    enterTo(go), "#ans");
  bind("#go", go);
  function go(){
    const v=$("ans").value;
    let ok;
    if(exp){ const r=gradeExplain(it, v); ok = r.hits.length>=r.need3; }
    else ok = dirOf(id)==="f" ? checkAns(v, it.a) : checkAns(v, it.rb);
    if(!ok){ $("err").textContent = exp ? "Use more of the key words shown above." : "Type the answer shown above."; shake($("ans")); return; }
    const oh=$("ownHook"); if(oh && oh.value.trim()){ S.hooks[i]=oh.value.trim(); save(); }
    S.cnt.fixes=(S.cnt.fixes||0)+1; if(S.cnt.fixes>=10) badge("fix10"); save();
    next();
  }
}

/* ================= Final test ================= */
function startTest(){
  const ids = shuffle(cardsOf(selItems()));
  for(let k=1;k<ids.length;k++) if(itemOf(ids[k])===itemOf(ids[k-1]) && k+1<ids.length) [ids[k],ids[k+1]]=[ids[k+1],ids[k]];

  S.stage[selKey()]="learn"; save();

}
function testNext(){
  if(SS.i>=SS.q.length) return testResults();
  const id=SS.q[SS.i]; SS.cur=id;
  show(`<div class="label">Final test · ${SS.i+1} of ${SS.q.length} · no hints</div>${promptHTML(id)}${inputHTML(id)}

function testResults(){
  SS.mode="testdone";

    S.stage[selKey()]="apply"; save();
    show(`<div class="center"><div class="huge">🏆</div><div class="big">Perfect: ${n}/${n}!</div><p>You know every card both ways. Apply is unlocked: use it in new examples. +200 XP</p>
      <div class="row" style="justify-content:center"><button class="primary" id="go">Go to Apply<span class="kbd">Enter</span></button></div></div>`, enterTo(startApply));

    <div class="row" style="justify-content:center"><button class="primary" id="go">Fix them<span class="kbd">Enter</span></button></div></div>`, enterTo(fixStart));
  bind("#go", fixStart);
  function fixStart(){ SS.mode="fix"; SS.fi=0; fixNext(); }
}
function fixNext(){
  SS.mode="fix";
  if(SS.fi>=SS.wrong.length){ SS={mode:"learn", last:null}; save(); return learnNext(); }
  const {id, typed} = SS.wrong[SS.fi];
  const c=S.c[id]; c.m++; c.l=2; c.sch=null; c.nx=S.step+rint(1,3);
  SS.fi++; save();
  correction(id, typed, false, fixNext);
}

/* ================= Apply ================= */
function applyItems(){
  const its = selItems();
  const sel = new Set(its.map(i=>norm(ITEMS[i].la||"")).filter(Boolean));
  const known = new Set(ITEMS.map((x,i)=>i).filter(i=>ITEMS[i].kind==="v" && isMastered(i+"|f") && isMastered(i+"|r")).map(i=>norm(ITEMS[i].la)));
  let out = [];
  if(sel.size){
    const ok = SENTENCES.filter(s => s.w.split(" ").every(w => sel.has(w) || known.has(w)));
    out = ok.slice();
    if(out.length<5){
      const extra = SENTENCES.filter(s=>!out.includes(s)).map(s=>({s, n:s.w.split(" ").filter(w=>sel.has(w)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0, 8-out.length).map(x=>x.s);
      out = out.concat(extra);
    }
    out = out.map(s => ({type:"s", ...s}));
  }
  if(S.sel.includes("G")) out = out.concat(GAPPLY.map(g => ({type:"e", ...g})));
  return out;
}
function startApply(){
  S.stage[selKey()]="apply"; save();
  SS = {mode:"apply", q:shuffle(applyItems()), done:0};
  SS.total = SS.q.length;
  applyNext();
}
function applyNext(){

    ${a.type==="s"?`<div class="row"><button class="small" id="help">Show word help</button></div><div class="gloss" id="gloss"></div>`:""}
    <div class="row"><button class="primary" id="go">Check<span class="kbd">Enter</span></button></div><div class="err" id="err"></div>`,
    enterTo(go), "#ans");
  bind("#help", () => { $("gloss").textContent = a.g; });

    if(!v.trim()){ $("err").textContent="Give it a try first."; shake($("ans")); return; }

}
function applyReveal(a, typed){
  show(`${a.type==="s"?`<div class="sentence">${esc(a.la)}</div>`:`<div class="q">${esc(a.q)}</div>`}
    <div class="you">You wrote: ${esc(typed)}</div>
    <div class="fb good"><div class="head">Model answer</div><div>${esc(a.en)}</div></div>
    ${a.type==="s"?`<div class="gloss">${esc(a.g)}</div>`:`<div class="keys">${a.pts.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`}
    <p style="margin-top:14px">How did you do? Be honest: small wording differences are fine.</p>
    <div class="row"><button class="primary" id="yes">✓ Got it<span class="kbd">1</span></button><button id="no">✗ Missed it<span class="kbd">2</span></button></div>`,
    e => { if(e.key==="1"||e.key==="Enter"){ e.preventDefault(); yes(); } else if(e.key==="2"){ e.preventDefault(); no(); } });
  bind("#yes", yes); bind("#no", no);
  function yes(){ tally(true, -1); SS.q.shift(); SS.done++; save(); applyNext(); }
  function no(){
    tally(false, -1);
    show(`${a.type==="s"?`<div class="sentence">${esc(a.la)}</div>`:`<div class="q">${esc(a.q)}</div>`}
      <div class="fb bad"><div class="head">Type the model answer to lock it in</div><div>${esc(a.en)}</div></div>
      <textarea id="ans"></textarea><div class="err" id="err"></div>

/* ================= Reviews & practice ================= */
function interleave(ids){
  const out=[], pool=ids.slice();
  while(pool.length){
    const prev = out.length ? itemOf(out[out.length-1]) : -1;
    const ok = pool.slice(0,4).map((id,j)=>j).filter(j => itemOf(pool[j])!==prev);
    const k = ok.length ? ok[rint(0, Math.min(1, ok.length-1))] : 0;
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function startReview(practice){
  let ids;
  if(practice){ ids = shuffle(cardsOf(selItems())); }
  else {
    const t = now(), testUnits = new Set(S.tests.flatMap(x=>x.units));
    const risk = id => { const s=S.c[id].sch, it=ITEMS[itemOf(id)];

       if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; }
}
function tone(f, t0, dur, type, vol){
  const a = ac(); if(!a) return;
  try{ const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine"; o.frequency.value=f;
    const s=a.currentTime+t0; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol||0.12,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s+dur+0.05); }catch(e){}
}

/* ================= Confetti & fireworks ================= */
const REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const FX = (() => {
  const cv = $("fx"); let ctx = null;
  try{ ctx = cv && cv.getContext ? cv.getContext("2d") : null; }catch(e){ ctx = null; }
  let P = [], raf = null;
  const COLORS = ["#ff6b9d","#ffd166","#34d399","#38bdf8","#a78bfa","#ff9a3d","#f472b6","#fde047"];
  function size(){ if(!ctx) return; const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
  window.addEventListener("resize", size); size();
  function star(r){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r/2.2:r, a=i*Math.PI/5; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P = P.filter(p => p.life < p.max);
    P.forEach(p => { p.life++; p.vy+=.2; p.vx*=.986; p.vy*=.986; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.sh===0) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else if(p.sh===1){ ctx.beginPath(); ctx.arc(0,0,p.s/2.6,0,6.283); ctx.fill(); } else star(p.s/1.5);
      ctx.restore(); });
    if(P.length) raf = requestAnimationFrame(loop); else { ctx.clearRect(0,0,innerWidth,innerHeight); raf = null; }
  }
  function burst(x, y, n, power, spread, angle){
    if(!ctx) return; n = REDUCE ? Math.min(n||60, 12) : (n||60); power = power||9; spread = spread==null ? Math.PI*2 : spread; angle = angle==null ? -Math.PI/2 : angle;
    for(let k=0;k<n;k++){ const a=angle+(Math.random()-.5)*spread, v=power*(.45+Math.random()*.75);
      P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:5+Math.random()*7,c:COLORS[k%COLORS.length],sh:k%3,life:0,max:70+Math.random()*55}); }
    if(!raf) raf = requestAnimationFrame(loop);
  }
  return {
    burst,
    confetti(n){ n=n||100; burst(innerWidth*.2, innerHeight*.85, n/2, 16, .8, -Math.PI/2+.4); burst(innerWidth*.8, innerHeight*.85, n/2, 16, .8, -Math.PI/2-.4); },
    fireworks(times){ for(let t=0;t<(times||5);t++) setTimeout(() => burst(innerWidth*(.15+Math.random()*.7), innerHeight*(.12+Math.random()*.35), 70, 8), t*260); },
    at(el, n, power){ const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
      burst(r ? r.left+r.width/2 : innerWidth/2, r ? r.top+r.height/2 : innerHeight/2, n||24, power||6); }
  };
})();

function speedStart(){

  speedNext();

    const b = $("tbar"); if(b) b.style.width = Math.max(0, SS.left/60*100)+"%";
    if(SS.left<=0) speedEnd();
  }, 100);

function speedNext(){
  const id = pickRandom(SS.pool, SS.last); SS.last = id;
  const {right, opts, qs} = mcOptions(id);
  const mult = 1 + Math.min(3, Math.floor(SS.combo/5));
  show(`<div class="gametop"><div class="score">⏱️ ${SS.score} pts</div><span class="mult ${SS.combo&&SS.combo%5===0?"up":""}">×${mult} combo</span></div>

    ${promptHTML(id)}${qs?`<div class="forms" style="margin-top:-8px">Which question does this answer?</div>`:""}
    <div class="mc ${qs?"qs":""}">${opts.map((o,k)=>`<button data-k="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`,
    e => { const n=+e.key; if(n>=1 && n<=opts.length){ e.preventDefault(); pick(n-1); } });
  const btns = [...main.querySelectorAll(".mc button")]; btns.forEach(b => b.onclick = () => pick(+b.dataset.k));
  let done = false;
  function pick(k){
    if(done || SS.mode!=="speed") return; done = true;
    const ok = opts[k]===right; SS.n++;
    btns.forEach((b,j) => { b.disabled=true; if(opts[j]===right) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
    if(ok){ SS.score += 1 + Math.min(3, Math.floor(SS.combo/5)); SS.combo++; SS.right++; tally(true, itemOf(id)); }
    else { SS.combo = 0; SS.left -= 3; tally(false, itemOf(id)); }

  clearTimer();
  const score = SS.score, right = SS.right, n = SS.n;
  const rec = setBest("speed", score);
  if(score>=30) badge("speed");
  arcadeEnd("⏱️ Time's up!", `${score} pts`, `${right} right out of ${n}. Wrong answers cost 3 seconds; every 5 in a row raises your multiplier.`, rec, speedStart);
}

/* ================= Match ================= */
function matchStart(){
  clearTimer();
  const items = shuffle(selItems()).slice(0,6);
  const tiles = shuffle(items.flatMap(i => [{i, side:"a", t:ITEMS[i].kind==="v" ? ITEMS[i].la : ITEMS[i].a[0]}, {i, side:"b", t:ITEMS[i].kind==="v" ? ITEMS[i].m : ITEMS[i].q}]));
  SS = {mode:"match", tiles, sel:null, left:items.length, miss:0, t0:Date.now()};
  show(`<div class="gametop"><div class="score">🧩 <span id="mt">0.0</span> s</div><span class="mult">${items.length} pairs</span></div>
    <p class="sub" style="margin-top:0">Tap a card, then tap its partner.</p>
    <div class="tiles">${tiles.map((x,k)=>`<button class="tile ${x.side==="a"?"la":""}" data-k="${k}">${esc(x.t)}</button>`).join("")}</div>`, null);
  TIMER = setInterval(() => { if(SS.mode!=="match"){ clearTimer(); return; } const el=$("mt"); if(el) el.textContent=((Date.now()-SS.t0)/1000).toFixed(1); }, 100);
  main.querySelectorAll(".tile").forEach(b => b.onclick = () => tap(+b.dataset.k, b));
  function tap(k, b){
    if(SS.mode!=="match" || b.classList.contains("ok")) return;
    if(SS.sel==null){ SS.sel=k; b.classList.add("sel"); SFX.pop(); return; }
    if(SS.sel===k){ b.classList.remove("sel"); SS.sel=null; return; }
    const pb = main.querySelector(`.tile[data-k="${SS.sel}"]`), p = SS.tiles[SS.sel], x = SS.tiles[k];
    pb.classList.remove("sel"); SS.sel = null;
    if(p.i===x.i && p.side!==x.side){
      pb.classList.add("ok"); b.classList.add("ok"); SS.left--; tally(true, x.i); FX.at(b, 22, 5);
      if(!SS.left){ const secs = Math.round((Date.now()-SS.t0)/100)/10; clearTimer(); setTimeout(() => matchEnd(secs), 450); }
    } else {
      [pb,b].forEach(e => { e.classList.remove("bad"); void e.offsetWidth; e.classList.add("bad"); });
      SS.miss++; tally(false, p.i);
    }
  }
}
function matchEnd(secs){
  const miss = SS.miss;
  const rec = setBest("match", secs, true);
  if(secs<40) badge("match");
  arcadeEnd("🧩 All matched!", `${secs.toFixed(1)} s`, `${miss} mismatch${miss===1?"":"es"}. Try to beat your time!`, rec, matchStart);
}

/* ================= Survival ================= */
function survStart(){
  clearTimer();
  SS = {mode:"surv", pool:cardsOf(selItems()).filter(id => !isExplain(id)), lives:3, score:0, last:null, msg:"", hit:false};
  survNext();
}
function survNext(){
  const id = pickRandom(SS.pool, SS.last); SS.last = id;
  show(`<div class="gametop"><div class="hearts">${heartsHTML(SS.lives,3)}</div><div class="score">🛡️ ${SS.score}</div></div>
    ${SS.msg}${promptHTML(id)}${inputHTML(id)}
    <div class="row"><button class="primary" id="go">Go<span class="kbd">Enter</span></button></div><div class="err" id="err"></div>`, enterTo(go), "#ans");
  if(SS.hit){ main.classList.remove("enter"); void main.offsetWidth; main.classList.add("hit"); SS.hit=false; }
  bind("#go", go);
  function go(){
    if(SS.mode!=="surv") return;
    const v = $("ans").value;
    if(!v.trim()){ $("err").textContent="Type an answer (or your best guess)."; shake($("ans")); return; }
    const ok = gradeCard(id, v).ok; tally(ok, itemOf(id));
    if(ok){ SS.score++; SS.msg="";
      if(SS.score%10===0 && SS.lives<5){ SS.lives++; toast("💖","Extra life!",`${SS.score} survived`,"pink"); } }
    else { SS.lives--; SS.hit=true;
      SS.msg = `<div class="fb bad" style="margin:0 0 12px"><div class="head">✗ ${esc(answerText(id))}</div><div class="sub">was the answer to the last one</div></div>`; }
    if(SS.lives<=0) return survEnd();
    survNext();
  }
}
function survEnd(){
  const score = SS.score;
  const rec = setBest("surv", score);
  if(score>=25) badge("surv");
  arcadeEnd("💀 Game over", `${score}`, `answers survived. Every 10 in a row earns a bonus life (max 5).`, rec, survStart);
}

/* ================= Boss Battle ================= */
function bossStart(){
  clearTimer();
  const lv = i => S.c[i+"|f"].l + S.c[i+"|r"].l;
  const its = selItems().slice().sort((a,b) => (S.miss[b]||0)-(S.miss[a]||0) || lv(a)-lv(b)).slice(0,6);
  const q = interleave(shuffle(cardsOf(its)));
  SS = {mode:"boss", q, max:q.length, lives:3, msg:"", hurt:false, hitme:false};
  bossNext();
}
function bossNext(){
  if(!SS.q.length) return bossWin();
  const id = SS.q[0];
  const hp = SS.q.length*10, max = SS.max*10;
  show(`<div class="boss"><div class="face2" id="bface">${BOSS.emoji}</div><div class="nm">${esc(BOSS.name)}</div>
      <div class="hp"><div style="width:${100*hp/max}%"></div></div><div class="sub">${hp}/${max} HP · built from your toughest cards</div></div>
    <div class="gametop"><div class="hearts">${heartsHTML(SS.lives,3)}</div><span class="mult">⚔️ Answer to attack</span></div>
    ${SS.msg}${promptHTML(id)}${inputHTML(id)}
    <div class="row"><button class="primary" id="go">Strike!<span class="kbd">Enter</span></button></div><div class="err" id="err"></div>`, enterTo(go), "#ans");
  if(SS.hurt){ const f=$("bface"); f.classList.add("ouch"); FX.at(f, 26, 6);
    const r=f.getBoundingClientRect(), d=document.createElement("div"); d.className="dmg"; d.textContent="💥 −10";
    d.style.left=(r.left+r.width)+"px"; d.style.top=r.top+"px"; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); SS.hurt=false; }
  if(SS.hitme){ main.classList.remove("enter"); void main.offsetWidth; main.classList.add("hit"); SS.hitme=false; }
  bind("#go", go);
  function go(){
    if(SS.mode!=="boss") return;
    const v = $("ans").value;
    if(!v.trim()){ $("err").textContent="Type an answer to attack."; shake($("ans")); return; }
    const ok = gradeCard(id, v).ok; tally(ok, itemOf(id));
    SS.q.shift();
    if(ok){ SS.hurt = true; SS.msg = ""; }
    else { SS.lives--; SS.hitme = true; insertAt(SS.q, id, rint(2,3));
      SS.msg = `<div class="fb bad" style="margin:0 0 12px"><div class="head">${BOSS.emoji} The boss strikes back!</div><div class="sub">Right answer: <b>${esc(answerText(id))}</b>. It'll come back soon.</div></div>`; }
    if(SS.lives<=0) return bossLose();
    bossNext();
  }
}
function bossWin(){
  setBest("boss", 1); badge("boss"); addXP(100, true);
  SS.mode = "arcadeEnd";
  show(`<div class="center"><div class="huge">🏆</div><div class="big">You defeated ${esc(BOSS.name)}!</div><p>Your toughest cards just got a lot less tough. +100 XP</p>
    <div class="row" style="justify-content:center"><button class="primary" id="again">Fight again<span class="kbd">Enter</span></button><button id="h">Home</button></div></div>`, enterTo(bossStart));
  bind("#again", bossStart); bind("#h", home);
  FX.fireworks(9); bigText("⚔️ VICTORY!"); SFX.big();
}
function bossLose(){
  SS.mode = "arcadeEnd";
  show(`<div class="center"><div class="huge">${BOSS.emoji}</div><div class="big">The boss wins this round</div><p>Every miss showed you the right answer. Go again and finish it off!</p>
    <div class="row" style="justify-content:center"><button class="primary" id="again">Rematch<span class="kbd">Enter</span></button><button id="h">Home</button></div></div>`, enterTo(bossStart));
  bind("#again", bossStart); bind("#h", home);
}

/* ================= Flashcards ================= */
function flashStart(){
  clearTimer();
  const q = interleave(shuffle(cardsOf(selItems())));
  SS = {mode:"flash", q, knew:0, total:q.length};
  flashNext();
}
function flashNext(){
  if(!SS.q.length) return flashEnd();
  const id = SS.q[0], it = ITEMS[itemOf(id)], d = dirOf(id);
  const front = d==="f"
    ? (it.kind==="v" ? `<div class="prompt">${esc(it.la)}</div><div class="forms">${esc(it.forms)}</div>` : `<div class="q">${esc(it.q)}</div>`)
    : (it.kind==="v" ? `<div class="meaning">${esc(it.m)}</div><div class="sub">…in Latin?</div>` : `<div class="prompt" style="font-size:1.6rem">${esc(it.a[0])}</div><div class="sub">What's the idea behind it?</div>`);
  const back = `<div class="meaning" style="margin:0">${esc(answerText(id))}</div>`;
  show(`<div class="gametop"><div class="score">🃏 ${SS.total-SS.q.length+1}/${SS.total}</div><span class="mult">${SS.knew} known</span></div>
    <div class="flip" id="flip"><div class="flip-inner"><div class="face front">${front}<div class="hint">Tap or press Space to flip</div></div>
      <div class="face back">${back}<div class="hook" style="margin-top:12px">💡 ${esc(it.h)}</div></div></div></div>
    <div class="row" id="rate" style="visibility:hidden;justify-content:center"><button class="primary" id="yes">😎 Knew it<span class="kbd">1</span></button><button id="no">🤔 Not yet<span class="kbd">2</span></button></div>`,
    e => { if(e.key===" " || e.key==="Enter"){ e.preventDefault(); flip(); } else if(e.key==="1" && flipped){ e.preventDefault(); yes(); } else if(e.key==="2" && flipped){ e.preventDefault(); no(); } });
  let flipped = false;
  function flip(){ flipped = !flipped; $("flip").classList.toggle("on", flipped); if(flipped){ $("rate").style.visibility="visible"; SFX.pop(); } }
  $("flip").onclick = flip; bind("#yes", yes); bind("#no", no);
  function yes(){ SS.q.shift(); SS.knew++; addXP(2, true); flashNext(); }
  function no(){ const x = SS.q.shift(); insertAt(SS.q, x, rint(3,5)); flashNext(); }
}
function flashEnd(){
  SS.mode = "arcadeEnd";
  show(`<div class="center"><div class="huge">🃏</div><div class="big">Deck done!</div><p>${SS.total} cards, both directions. The ones you weren't sure about came back until you knew them.</p>
    <div class="row" style="justify-content:center"><button class="primary" id="again">Shuffle again<span class="kbd">Enter</span></button><button id="h">Home</button></div></div>`, enterTo(flashStart));
  bind("#again", flashStart); bind("#h", home);
  FX.confetti(90); SFX.star();
}

/* ================= Goal ring, badges sheet, sound toggle ================= */
function ringHTML(){
  const g = goalToday(), n = Math.min(g.n, GOAL), p = n/GOAL, C = 2*Math.PI*36;
  return `<div class="ring ${p>=1?"done":""}"><svg width="86" height="86" viewBox="0 0 86 86"><defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff6b9d"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    <circle cx="43" cy="43" r="36" fill="none" style="stroke:var(--soft)" stroke-width="10"/>
    <circle cx="43" cy="43" r="36" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" style="transition:stroke-dashoffset .8s"/></svg>
    <div class="n"><div>${n}/${GOAL}<small>${p>=1?"goal done! 🎯":"today's goal"}</small></div></div></div>`;
}
$("bdgBtn").onclick = () => {
  const got = BADGES.filter(b => S.badges[b[0]]).length;
  $("bdgCount").textContent = `${got}/${BADGES.length}`;
  $("bdgList").innerHTML = BADGES.map(b => `<div class="bdg ${S.badges[b[0]]?"got":"locked"}"><div class="e">${b[1]}</div><div class="n">${esc(b[2])}</div><div class="d">${esc(b[3])}</div></div>`).join("");
  $("bdgOv").classList.add("open");
};
$("closeBdg").onclick = () => $("bdgOv").classList.remove("open");
function sndLabel(){ $("sndBtn").textContent = S.opt.sound ? "🔊 Sound on" : "🔇 Sound off"; }
$("sndBtn").onclick = () => { S.opt.sound = !S.opt.sound; save(); sndLabel(); if(S.opt.sound) SFX.pop(); };
sndLabel(); floaters();

/* ================= Word list, settings, reset ================= */
$("homeBtn").onclick = () => { clearTimer(); home(); };
$("listBtn").onclick = () => {
  $("listTable").innerHTML = selItems().map(i => { const it=ITEMS[i];
    return `<tr><td>${esc(it.kind==="v"?it.la:it.q)}</td><td>${esc(fwdAnswer(it))}<div class="h">💡 ${esc(it.h)}${S.hooks[i]?`<br>✍️ ${esc(S.hooks[i])}`:""}</div></td></tr>`; }).join("");
  $("listOv").classList.add("open");
};
$("closeList").onclick = () => $("listOv").classList.remove("open");
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify({key:KEY, data:S})))); }
$("setBtn").onclick = () => { $("exportBox").value = exportCode(); $("importErr").textContent=""; $("copyMsg").textContent=""; $("setOv").classList.add("open"); };
$("closeSet").onclick = () => $("setOv").classList.remove("open");
$("copyBtn").onclick = () => { $("exportBox").select(); try{ navigator.clipboard.writeText($("exportBox").value); }catch(e){ try{document.execCommand("copy");}catch(e2){} } $("copyMsg").textContent="Copied!"; };
function importCode(code){
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(String(code).trim())))); } catch(e){ return "That code doesn't look right. Copy the whole code and try again."; }
  if(!obj || obj.key!==KEY) return "That code is from a different trainer, so it can't be loaded here.";
  const s = migrate(obj.data);
  if(!s) return "That code is damaged. Try copying it again.";
  S = s; save(); return null;
}
$("importBtn").onclick = () => {
  const err = importCode($("importBox").value);
  if(err){ $("importErr").textContent = err; return; }
  $("setOv").classList.remove("open"); home();
};
$("eraseBtn").onclick = () => { if(confirm("Erase ALL progress for this trainer? This can't be undone.")){ S=freshState(); save(); $("setOv").classList.remove("open"); home(); } };
$("resetSel").onclick = () => {
  if(!confirm("Reset progress for the selected units?")) return;
  selItems().forEach(i => { delete S.intro[i]; delete S.hooks[i]; delete S.miss[i]; S.c[i+"|f"]={l:0,nx:0,m:0,sch:null}; S.c[i+"|r"]={l:0,nx:0,m:0,sch:null}; });
  Object.keys(S.stage).forEach(k => { if(S.sel.some(u=>k.includes(u))) delete S.stage[k]; });
  S.sel.forEach(u => delete S.unitDone[u]);
  save(); home();
};

home();
</script>
</body>
</html>
